#
# main.static-extra.conf (CDN app)
# /etc/nginx-rc/extra.d/<web-app>.location.main.static-extra.conf
# 
# Custom conf for the server {} block primarily containing rules
# for handling static files not handled by the RunCloud configured
# location.static block.
# 



# ----------------------
# Handle more file types
# ----------------------

location ~* \.(?:webmanifest)$ {
  expires 1M;
  access_log off;
  add_header "Access-Control-Allow-Origin" "*";
  add_header Cache-Control "public";
}

# PDFs
location ~* \.(?:pdf)$ {
  expires 1M;
  access_log off;
  # add_header "Access-Control-Allow-Origin" "*";
  add_header "Access-Control-Allow-Headers" "Range";
  add_header Cache-Control "public";
}

# Videos
# https://github.com/h5bp/server-configs-nginx/blob/main/mime.types#L54-L63
location ~* \.(?:3gp|3gpp|f4p|f4v|m4v|mp4|mpeg|mpg|ogv|mov|webm|flv|mng|asf|asx|avi)$ {
  expires 1y;
  access_log off;
  add_header "Access-Control-Allow-Origin" "*";
  add_header Cache-Control "public";
}
